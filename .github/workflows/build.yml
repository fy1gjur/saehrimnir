name: Building bootable container and ISO image
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_TAG: "latest"

jobs:
  build-container:
    name: Building and pushing bootable container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checking out the repository
        id: checkout-repository
        uses: actions/checkout@v6

      - name: Freeing some disk space
        id: free-disk-space
        run: rm -rf /opt/hostedtoolcache

      - name: Building bootable container image with Buildah
        id: build-container
        run: buildah build -t ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Pushing bottable container image to GitHub Container Registry
        id: push-container
        run: buildah push --creds=${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  build-iso:
    name: Building ISO image
    runs-on: ubuntu-latest
    needs: build-container
    permissions:
      contents: read
    steps:
      - name: Checking out the repository
        id: checkout-repository
        uses: actions/checkout@v6

      - name: Freeing some disk space
        id: free-disk-space
        run: rm -rf /opt/hostedtoolcache

      - name: Building ISO image with bootc-image-builder
        id: build-iso
        uses: osbuild/bootc-image-builder-action@main
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          config-file: ./iso.toml
          types: |
            anaconda-iso
          rootfs: ext4
          additional-args: --use-librepo=True

      - name: Uploading ISO image as job artifact
        id: upload-iso
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-iso
          path: ${{ steps.build-iso.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
